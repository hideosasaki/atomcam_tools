<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { background:black; margin:0; padding:0; }
  html, body, video { height:100%; width:100%; }
  #controls {
    position:fixed; top:20px; left:20px;
    z-index:10;
  }
  #mic-btn {
    width:112px; height:112px; border-radius:50%; border:none;
    cursor:pointer; opacity:0.8; display:flex;
    align-items:center; justify-content:center; background:#03a9f4;
  }
  #mic-btn svg { width:48px; height:48px; fill:white; }
  #mic-btn:hover { opacity:1; }
  #mic-btn.on { background:#bc423a; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="controls">
  <button id="mic-btn" title="Microphone OFF"></button>
</div>
<script>
var video = document.getElementById('video');

// Mic
var AUDIO_FIFO = '/tmp/audio_in.fifo';
var DEFAULT_VOL = 100;
var micTrack = null;
var micSender = null;
var micEnabled = false;
var micBtn = document.getElementById('mic-btn');
var micOnIcon = '<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>';
var micOffIcon = '<svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>';
micBtn.innerHTML = micOffIcon;

function updateMicButton() {
  micBtn.className = micEnabled ? 'on' : '';
  micBtn.innerHTML = micEnabled ? micOnIcon : micOffIcon;
  micBtn.title = micEnabled ? 'Microphone ON' : 'Microphone OFF';
}

function sendAstreamCmd(cmd) {
  var url = '/cgi-bin/cmd.cgi?port=socket';
  return fetch(url, {
    method: 'POST',
    body: JSON.stringify({exec: cmd})
  });
}

// Retry state
var pc = null;
var ws = null;
var retryDelay = 3000;
var retryTimer = null;
var disconnectTimer = null;
var wsUrl = location.protocol + '//' + location.host + '/go2rtc/api/ws?src=video0';

function cleanup() {
  if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
  if (micEnabled) {
    micEnabled = false;
    if (micSender) micSender.replaceTrack(null);
    if (micTrack) micTrack.enabled = false;
    video.muted = true;
    video.volume = 0;
    updateMicButton();
    sendAstreamCmd('astream stop').catch(function() {});
  }
  micSender = null;
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
}

function scheduleRetry() {
  if (retryTimer) return;
  console.log('[WebRTC] retry in ' + retryDelay + 'ms');
  retryTimer = setTimeout(function() {
    retryTimer = null;
    connect();
  }, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 30000);
}

function connect() {
  cleanup();

  try {
    pc = new RTCPeerConnection({ iceServers: [] });
  } catch (e) {
    scheduleRetry();
    return;
  }

  pc.addEventListener('iceconnectionstatechange', function() {
    var state = pc.iceConnectionState;
    console.log('[WebRTC] ICE state: ' + state);
    if (state === 'connected') {
      retryDelay = 3000;
      if (disconnectTimer) { clearTimeout(disconnectTimer); disconnectTimer = null; }
      video.play().catch(function() {});
    } else if (state === 'disconnected') {
      if (!disconnectTimer) {
        disconnectTimer = setTimeout(function() {
          disconnectTimer = null;
          console.log('[WebRTC] disconnected timeout, reconnecting');
          cleanup();
          scheduleRetry();
        }, 5000);
      }
    } else if (state === 'failed') {
      cleanup();
      scheduleRetry();
    }
  });

  var tracks = ['video', 'audio'].map(function(kind) {
    return pc.addTransceiver(kind, {direction: 'recvonly'}).receiver.track;
  });
  var stream = new MediaStream(tracks);
  video.srcObject = stream;

  // Pre-create sendonly transceiver for mic
  var sendTransceiver = pc.addTransceiver('audio', {direction: 'sendonly'});
  micSender = sendTransceiver.sender;

  // WebSocket
  try {
    ws = new WebSocket(wsUrl.replace(/^http/, 'ws'));
  } catch (e) {
    cleanup();
    scheduleRetry();
    return;
  }

  ws.addEventListener('close', function() {
    console.log('[WebRTC] WebSocket closed');
    cleanup();
    scheduleRetry();
  });

  ws.addEventListener('open', function() {
    pc.addEventListener('icecandidate', function(ev) {
      if (!ev.candidate) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type: 'webrtc/candidate', value: ev.candidate.candidate}));
      }
    });
    pc.createOffer().then(function(offer) {
      return pc.setLocalDescription(offer);
    }).then(function() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type: 'webrtc/offer', value: pc.localDescription.sdp}));
      }
    });
  });

  ws.addEventListener('message', function(ev) {
    var msg = JSON.parse(ev.data);
    if (msg.type === 'webrtc/candidate') {
      pc.addIceCandidate({candidate: msg.value, sdpMid: '0'});
    } else if (msg.type === 'webrtc/answer') {
      pc.setRemoteDescription({type: 'answer', sdp: msg.value});
    }
  });
}

// Mic button (lazy getUserMedia)
micBtn.addEventListener('click', function() {
  if (!pc) return;
  if (micEnabled) {
    micEnabled = false;
    if (micSender) micSender.replaceTrack(null);
    if (micTrack) micTrack.enabled = false;
    video.muted = true;
    video.volume = 0;
    updateMicButton();
    sendAstreamCmd('astream stop').catch(function() {});
  } else {
    micBtn.className = 'on';
    micBtn.style.opacity = '0.5';
    micBtn.innerHTML = micOnIcon;

    function startMic() {
      return sendAstreamCmd('astream ' + AUDIO_FIFO + ' ' + DEFAULT_VOL + ' alaw').then(function() {
        micEnabled = true;
        micTrack.enabled = true;
        if (micSender) micSender.replaceTrack(micTrack);
        video.muted = false;
        video.volume = 1.0;
        updateMicButton();
        micBtn.style.opacity = '0.8';
      });
    }

    if (!micTrack) {
      navigator.mediaDevices.getUserMedia({audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }}).then(function(micStream) {
        micTrack = micStream.getTracks()[0];
        micTrack.enabled = false;
        return startMic();
      }).catch(function() {
        updateMicButton();
        micBtn.style.opacity = '0.8';
      });
    } else {
      startMic().catch(function() {
        updateMicButton();
        micBtn.style.opacity = '0.8';
      });
    }
  }
});

// Start connection
connect();
</script>
</body>
</html>
