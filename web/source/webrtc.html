<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      body {
        background-color: black;
        margin: 0;
        padding: 0;
      }

      html, body, video {
        height: 100%;
        width: 100%;
      }

      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }
      #mic-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        opacity: 0.8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #mic-btn svg {
        width: 24px;
        height: 24px;
        fill: white;
      }
      #mic-btn:hover { opacity: 1; }
      #mic-btn.off { background: #666; }
      #mic-btn.on  { background: #bc423a; }
      #mic-btn.connecting {
        background: #bc423a;
        animation: pulse 1.2s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.9; }
      }

      #vol-controls {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .vol-btn {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: none;
        background: rgba(255,255,255,0.15);
        cursor: pointer;
        opacity: 0.8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .vol-btn:hover { opacity: 1; }
      .vol-btn:active { background: rgba(255,255,255,0.3); }
      .vol-btn svg {
        width: 24px;
        height: 24px;
        fill: white;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <div id="vol-controls">
      <button id="vol-icon-btn" class="vol-btn"></button>
      <button id="vol-down" class="vol-btn"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
      <button id="vol-up" class="vol-btn"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
    </div>
    <div id="controls" style="display:none">
      <button id="mic-btn" class="off" title="Microphone OFF"></button>
    </div>
    <script>
      var video = document.getElementById('video');
      var volIconBtn = document.getElementById('vol-icon-btn');
      var volDown = document.getElementById('vol-down');
      var volUp = document.getElementById('vol-up');
      var volume = 1.0;
      var prevVolume = 0.5;
      var VOL_KEY = 'webrtc_volume';

      var speakerBase = '<path d="M3 9v6h4l5 5V4L7 9H3z"/>';
      var wave1 = '<path d="M14 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>';
      var wave2 = '<path d="M15.5 5.5a8 8 0 0 1 0 13" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>';
      var wave3 = '<path d="M17 3a11 11 0 0 1 0 18" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>';
      var muteX = '<line x1="15" y1="8" x2="21" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="8" x2="15" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>';
      var volIcons = [
        '<svg viewBox="0 0 24 24">' + speakerBase + muteX + '</svg>',
        '<svg viewBox="0 0 24 24">' + speakerBase + '</svg>',
        '<svg viewBox="0 0 24 24">' + speakerBase + wave1 + '</svg>',
        '<svg viewBox="0 0 24 24">' + speakerBase + wave1 + wave2 + '</svg>',
        '<svg viewBox="0 0 24 24">' + speakerBase + wave1 + wave2 + wave3 + '</svg>'
      ];

      function loadVolume() {
        try {
          var saved = localStorage.getItem(VOL_KEY);
          if (saved !== null) volume = parseFloat(saved);
        } catch(e) {}
      }

      function saveVolume() {
        try { localStorage.setItem(VOL_KEY, volume); } catch(e) {}
      }

      function applyVolume() {
        video.volume = volume;
        video.muted = (volume === 0);
        var idx = volume === 0 ? 0 : Math.ceil(volume * 4);
        volIconBtn.innerHTML = volIcons[idx];
        saveVolume();
      }

      volIconBtn.addEventListener('click', function() {
        if (volume > 0) {
          prevVolume = volume;
          volume = 0;
        } else {
          volume = prevVolume > 0 ? prevVolume : 0.25;
        }
        applyVolume();
      });

      volDown.addEventListener('click', function() {
        volume = Math.max(0, Math.round((volume - 0.25) * 100) / 100);
        applyVolume();
      });

      volUp.addEventListener('click', function() {
        volume = Math.min(1, Math.round((volume + 0.25) * 100) / 100);
        applyVolume();
      });

      loadVolume();
      applyVolume();

      const GO2RTC_PORT = 1984;
      const AUDIO_FIFO = '/tmp/audio_in.fifo';
      const DEFAULT_VOL = 40;

      let micTrack = null;
      let micSender = null;
      let micEnabled = false;
      const micBtn = document.getElementById('mic-btn');
      const controls = document.getElementById('controls');

      const micOnIcon = '<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>';
      const micOffIcon = '<svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>';

      function updateMicButton() {
        micBtn.className = micEnabled ? 'on' : 'off';
        micBtn.innerHTML = micEnabled ? micOnIcon : micOffIcon;
        micBtn.title = micEnabled ? 'Microphone ON' : 'Microphone OFF';
      }

      function sendAstreamCmd(cmd) {
        var url = location.protocol + '//' + location.hostname + '/cgi-bin/cmd.cgi?port=socket';
        return fetch(url, {
          method: 'POST',
          body: JSON.stringify({exec: cmd})
        });
      }

      micBtn.addEventListener('click', function() {
        if (!micTrack || !micSender) return;
        if (micEnabled) {
          micEnabled = false;
          micSender.replaceTrack(null);
          micTrack.enabled = false;
          updateMicButton();
          sendAstreamCmd('astream stop').catch(function(e) {
            console.warn('[astream] stop', e);
          });
        } else {
          micBtn.className = 'connecting';
          micBtn.innerHTML = micOnIcon;
          sendAstreamCmd('astream ' + AUDIO_FIFO + ' ' + DEFAULT_VOL + ' alaw').then(function() {
            micEnabled = true;
            micTrack.enabled = true;
            micSender.replaceTrack(micTrack);
            updateMicButton();
          }).catch(function(e) {
            console.warn('[astream] start', e);
            updateMicButton();
          });
        }
      });

      async function PeerConnection(media) {
        const pc = new RTCPeerConnection({
          iceServers: []
        });
        const tracks = ['video', 'audio']
          .filter(kind => media.indexOf(kind) >= 0)
          .map(kind => pc.addTransceiver(kind, {direction: 'recvonly'}).receiver.track);
        const stream = new MediaStream(tracks);
        document.getElementById('video').srcObject = stream;

        if (media.indexOf('microphone') >= 0) {
          try {
            const micStream = await navigator.mediaDevices.getUserMedia({audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }});
            micTrack = micStream.getTracks()[0];
            micTrack.enabled = false;
            const transceiver = pc.addTransceiver('audio', {direction: 'sendonly'});
            micSender = transceiver.sender;
            controls.style.display = '';
            micBtn.innerHTML = micOffIcon;
            updateMicButton();
          } catch (e) {
            console.error('microphone access denied:', e);
          }
        }

        return pc;
      }

      async function connect(media) {
        const pc = await PeerConnection(media);
        const src = new URLSearchParams(location.search).get('src') || 'video0';
        const url = new URL(`api/ws?src=${src}`, `${location.protocol}//${location.hostname}:${GO2RTC_PORT}`);
        const ws = new WebSocket(url.toString().replace(/^http/, 'ws'));

        ws.addEventListener('error', function(e) {
          console.error('[webrtc] WebSocket error:', e);
        });

        ws.addEventListener('close', function() {
          console.warn('[webrtc] WebSocket closed');
          if (micEnabled) {
            micEnabled = false;
            updateMicButton();
            sendAstreamCmd('astream stop');
          }
        });

        ws.addEventListener('open', () => {
          pc.addEventListener('icecandidate', ev => {
            if (!ev.candidate) return;
            const msg = {type: 'webrtc/candidate', value: ev.candidate.candidate};
            ws.send(JSON.stringify(msg));
          });

          pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
            const msg = {type: 'webrtc/offer', value: pc.localDescription.sdp};
            ws.send(JSON.stringify(msg));
          });
        });

        ws.addEventListener('message', ev => {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'webrtc/candidate') {
            pc.addIceCandidate({candidate: msg.value, sdpMid: '0'});
          } else if (msg.type === 'webrtc/answer') {
            pc.setRemoteDescription({type: 'answer', sdp: msg.value});
          }
        });
      }

      const media = new URLSearchParams(location.search).get('media');
      connect(media || 'video');
    </script>
  </body>
</html>
